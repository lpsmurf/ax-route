# USD per 1M tokens. Every entry names where the number came from and how much to trust it.
#
# Rule, inherited from ax-harness: a model with no published price reports cost null.
# Never an estimate, never interpolated from a similar model. A missing price is honest;
# a wrong one poisons every number downstream.

frontier:
  claude-opus-5: { input: 5, output: 25, source: "ax-harness config/models.yaml", confidence: high }
  claude-sonnet-5: { input: 2, output: 10, source: "ax-harness config/models.yaml", confidence: high }
  claude-haiku-4-5: { input: 1, output: 5, source: "ax-harness config/models.yaml", confidence: high }
  claude-fable-5-1: { input: 10, output: 50, cache_read: 0.25, source: "ax-harness config/models.yaml", confidence: high }
  claude-opus-4-8: { input: 5, output: 25, source: "ax-harness config/models.yaml", confidence: high }
  gpt-5.6-sol: { input: 4, output: 20, cache_read: 0.4, source: "ax-harness config/models.yaml", confidence: high }
  gpt-5.6-terra: { input: 2, output: 12, cache_read: 0.2, source: "ax-harness config/models.yaml", confidence: high }
  gpt-5.6-luna: { input: 0.2, output: 1.2, cache_read: 0.02, source: "ax-harness config/models.yaml", confidence: high }
  gpt-6-astra: { input: 10, output: 50, cache_read: 1.0, source: "ax-harness config/models.yaml", confidence: high }

# Nebius Token Factory. Primary source: the Token Factory API itself —
#   GET https://api.studio.nebius.com/v1/models?verbose=true  (authenticated, read 2026-09-23)
# which returns a `pricing` object per model. These are not aggregator figures.
# Nebius publishes no separate cached-input price, so cache_read is absent and cached
# tokens are billed at the input rate. Region: EU (Finland) — nebius.com/services/token-factory/inference-service.
