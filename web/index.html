<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AX — models &amp; spend</title>
<meta name="description" content="See what your AI coding tools actually cost you, and which work can move to a cheaper model without getting worse.">
<style>
:root{--bg:#fff;--panel:#f7f7f5;--ink:#16161a;--muted:#6b6b76;--line:#e4e4e0;
 --good:#0f7b56;--warn:#a66a12;--accent:#1f4fd8;--nav:#f2f2ef;
 --mono:ui-monospace,SFMono-Regular,Menlo,monospace}
:root:not([data-theme="light"]){@media (prefers-color-scheme:dark){
 --bg:#0e0e11;--panel:#17171c;--ink:#ececf1;--muted:#9a9aa8;--line:#26262e;
 --good:#3ecf9b;--warn:#e0a94a;--accent:#7aa2ff;--nav:#121216}}
:root[data-theme="dark"]{--bg:#0e0e11;--panel:#17171c;--ink:#ececf1;--muted:#9a9aa8;
 --line:#26262e;--good:#3ecf9b;--warn:#e0a94a;--accent:#7aa2ff;--nav:#121216}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
 font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
 -webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh}
nav{width:216px;flex:none;background:var(--nav);border-right:1px solid var(--line);padding:22px 0}
nav .brand{padding:0 20px 18px;font-weight:700;font-size:17px;letter-spacing:-.01em}
nav .brand span{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
nav .grp{padding:14px 20px 5px;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:600}
nav a{display:block;padding:8px 20px;color:var(--muted);text-decoration:none;font-size:14px;cursor:pointer;border-left:3px solid transparent}
nav a:hover{color:var(--ink)}
nav a.on{color:var(--ink);border-left-color:var(--accent);background:var(--panel);font-weight:600}
main{flex:1;padding:34px 30px 80px;max-width:1000px;min-width:0}
h1{font-size:27px;margin:0 0 6px;letter-spacing:-.02em}
.lede{color:var(--muted);max-width:66ch;margin:0 0 26px;font-size:15px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:30px 0 11px;font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
.big{font-size:19px;line-height:1.5;margin:0 0 8px;max-width:62ch}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.kpi .v{font-size:29px;font-weight:650;letter-spacing:-.02em;line-height:1.1}
.kpi .k{font-size:12px;color:var(--muted);margin-top:5px}
.kpi .n{font-size:11px;color:var(--muted);margin-top:7px;font-family:var(--mono)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);
 font-weight:600;padding:0 10px 8px 0;border-bottom:1px solid var(--line)}
td{padding:9px 10px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.good{color:var(--good);font-weight:600}.warn{color:var(--warn);font-weight:600}
.dim{color:var(--muted)}
.win{background:color-mix(in srgb,var(--good) 9%,transparent)}
.src{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:11px}
.note{font-size:13.5px;color:var(--muted);margin:10px 0 0;max-width:74ch}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--accent)}
.tag{display:inline-block;font-size:10.5px;font-family:var(--mono);padding:2px 7px;
 border:1px solid var(--line);border-radius:20px;color:var(--muted);vertical-align:2px}
.measured{border-color:var(--good);color:var(--good)}
.computed{border-color:var(--warn);color:var(--warn)}
.cmd{font-family:var(--mono);font-size:13px;background:var(--bg);border:1px solid var(--line);
 border-radius:8px;padding:12px 14px;overflow-x:auto;white-space:pre;color:var(--ink)}
.do{border-left:3px solid var(--good);padding-left:14px;margin:12px 0}
.view{display:none}.view.on{display:block}
.mobnav{display:none}
@media (max-width:760px){
 .app{flex-direction:column}
 nav{width:auto;border-right:0;border-bottom:1px solid var(--line);padding:14px 0 0}
 nav .grp{display:none}
 nav a{display:inline-block;border-left:0;border-bottom:3px solid transparent;padding:8px 14px}
 nav a.on{border-left:0;border-bottom-color:var(--accent);background:transparent}
 main{padding:24px 16px 60px}
 h1{font-size:22px}
}
</style>
</head>
<body>
<div class="app">
<nav>
  <div class="brand">AX<span>models &amp; spend</span></div>
  <div class="grp">Your money</div>
  <a data-v="overview" class="on">Overview</a>
  <a data-v="projects">Projects</a>
  <a data-v="roles">What your AI does</a>
  <div class="grp">Assessment</div>
  <a data-v="models">Models</a>
  <a data-v="proof">Proof</a>
</nav>
<main id="main"></main>
</div>
<script>
const frag=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content};
const usd=(n,d=2)=>n===null||n===undefined?'—':'$'+Number(n).toFixed(d);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const load=async f=>{try{const r=await fetch(f);return r.ok?await r.json():null}catch{return null}};

// Role ids are engineer words. Say what each one actually does.
const PLAIN={
 'memory-retrieval':['Looking things up','Finding a fact in your notes or a file'],
 'learning-extractor':['Pulling facts out of text','Turning a long answer into a short note'],
 'qa-test':['Checking work','Did the test pass, does this parse, is this valid'],
 'core-investigator':['Exploring your code','Working out how your project fits together'],
 'main-researcher':['Researching online','Looking things up on the web and summarising'],
 'implementer':['Writing code','Making the actual change you asked for'],
 'dreamer':['Reviewing your setup','Spotting repeated work worth automating'],
 'code-review':['Reviewing code','Catching bugs before they ship']
};

(async()=>{
const [estate,sweep,bench,replay,harness]=await Promise.all([
  load('estate.json'),load('sweep.json'),load('bench.json'),load('replay.json'),load('harness-usage.json')]);
const [frontier,escalate]=await Promise.all([load('frontier.json'),load('escalate.json')]);
const M=document.getElementById('main');
const V={};
const e=estate,sm=e&&e.summary;
const rs=sweep?sweep.results.filter(r=>r.cost_per_1k_tasks_usd!==null):[];
const win=sweep&&sweep.cheapest_passing;
const dear=rs.length?[...rs].sort((a,b)=>b.cost_per_1k_tasks_usd-a.cost_per_1k_tasks_usd)[0]:null;
const ratio=win&&dear?Math.round(dear.cost_per_1k_tasks_usd/win.cost_per_1k_tasks_usd):null;

// ---------------- Overview
V.overview=`
<h1>What your AI is costing you</h1>
<p class="lede">A real audit of one machine &mdash; yours would look like this. Nothing here was
typed in by hand. And the headline, measured on the same tasks by the same blind judge:
<strong>google/gemma-3-27b-it</strong> scores <strong>95.2%</strong>, exactly what
<strong>claude-opus-5</strong> scores, at <strong>159&times; less</strong>.</p>
<h2>The one thing to do</h2>
<div class="panel">
 <p class="big">Three of the eight jobs your AI does are <strong>simple</strong> &mdash; looking
 things up, pulling a fact out of text, checking whether something passes. On those,
 <strong>google/gemma-3-27b-it</strong> scores <strong>95.2%</strong> at
 <strong>$0.0152 per 1,000 tasks</strong>. Claude Haiku, measured on the
 same tasks, scores <strong>85.7%</strong> and costs
 <strong>12&times;</strong> more.</p>
 <p class="note" style="margin-top:0"><strong>We did not pick that model &mdash; the measurement
 did, and it overruled us.</strong> An earlier version of this page recommended Qwen3-30B, chosen
 by hand. When the test tasks were rewritten from toy questions to real ones (actual stack traces,
 config files, source) it scored 76.2% and failed the bar. The sweep replaced it. That is the
 product doing its job in public.</p>
 <div class="do">
  <p style="margin:0 0 8px"><strong>If you use Cursor, Cline, Continue or the OpenAI SDK</strong> &mdash; point it at Route and the switch is automatic:</p>
  <div class="cmd">npx ax-route serve
# then set your tool's base URL to  http://localhost:8787/v1</div>
 </div>
 <div class="do">
  <p style="margin:0 0 8px"><strong>If you use Claude Code</strong> &mdash; it speaks a different protocol, so Route can't sit in front of it yet. You can still stop overpaying today by changing one line per agent file:</p>
  <div class="cmd">~/.claude/agents/memory-retrieval.md
-  model: opus
+  model: haiku      # measured at 85.7% on these jobs, a fraction of the price</div>
 </div>
 <p class="note">Route names which files to change. It stays silent on the other five jobs,
 because it has not tested them.</p>
 <div class="src">source: results/sweep.json, results/frontier.json</div>
</div>
<h2>Run it on your own machine</h2>
<div class="panel">
 <div class="cmd">npx ax-route audit</div>
 <p class="note">No API key. No account. Nothing to sign up for. It reads the logs your AI tools
 already keep on your own computer and prints exactly the table above, for you. Takes a few seconds.</p>
</div>`:'<div class="panel">estate.json not loaded</div>'}`;

// ---------------- Projects
V.projects=e?`
<h1>Where the money went</h1>
<p class="lede">Every project your AI tools worked in, what it cost, and how much of that could
have run on a cheaper model. Project names are client names, so these are labels &mdash;
<span class="num">route audit --reveal</span> shows the real ones on your own machine.</p>
<div class="panel">
 <table><tr><th>project</th><th>requests</th><th>days active</th><th>paid</th><th>could move</th><th>share of spend</th></tr>
 ${e.spend.projects.slice(0,16).map(p=>{const sh=(p.cost_usd/e.spend.total_usd*100);return `<tr>
   <td class="num">${esc(p.label)}</td><td class="num">${p.requests.toLocaleString()}</td>
   <td class="num dim">${p.days}</td><td class="num">${usd(p.cost_usd)}</td>
   <td class="num good">${usd(p.addressable_usd)}</td>
   <td class="num dim">${sh.toFixed(1)}%<div class="bar"><i style="width:${Math.min(100,sh)}%"></i></div></td></tr>`}).join('')}
 </table>
 <p class="note">${esc(sm.basis)}.</p>
 <div class="src">source: results/estate.json &middot; ${esc(e.privacy)}</div>
</div>
<h2>Your repositories</h2>
<div class="panel">
 <p class="big" style="font-size:16px">${e.inventory.repos} repositories registered,
 ${e.repos.filter(r=>r.has_remote).length} with a remote. Connecting a repo lets the audit
 attribute spend to it and flag work that repeats often enough to be worth automating.</p>
 <p class="note">Repeat-work detection is designed but not built &mdash; today the audit
 attributes spend per project, which is what the table above shows. Saying otherwise would be
 claiming a feature that does not exist.</p>
 <div class="src">source: ~/dev/config/projects.tsv</div>
</div>`:'';

// ---------------- Roles
V.roles=e?`
<h1>What your AI actually does</h1>
<p class="lede">Your setup has ${e.inventory.agents} distinct jobs. Each one has a different cost
of being wrong, so each one deserves a different model. Green means tested. Amber means Route has
no evidence yet and will not tell you it is safe.</p>
<div class="panel">
 <table><tr><th>job</th><th>what it is</th><th>how hard</th><th>status</th></tr>
 ${e.routes.map(r=>{const p=PLAIN[r.job]||[r.job,''];const ok=r.status==='deployable';return `<tr class="${ok?'win':''}">
   <td><strong>${esc(p[0])}</strong><div class="num dim" style="font-size:11px">${esc(r.job)}</div></td>
   <td class="dim">${esc(p[1])}</td>
   <td class="dim">${esc(r.declared_tier==='mechanical'?'simple':r.declared_tier==='reasoning'?'thinking':'high stakes')}</td>
   <td class="${ok?'good':'warn'}">${ok?'&#10003; safe to move':'not tested'}<div class="dim" style="font-weight:400;font-size:11.5px;margin-top:3px">${esc(r.evidence)}</div></td></tr>`}).join('')}
 </table>
 <p class="note"><strong>${sm.roles_deployable} of ${sm.roles_total}</strong> jobs have real
 evidence behind them. The other ${sm.roles_untested} are the harder ones &mdash; writing code,
 reviewing code, research. A tool that painted all eight green would be guessing on five, and you
 would find out the expensive way.</p>
 <div class="src">source: results/estate.json &middot; evidence from results/sweep.json</div>
</div>`:'';

// ---------------- Models (assessment)
V.models=sweep?(()=>{
 const W=660,H=250,PL=52,PB=32,PT=12,PR=14;
 const lg=c=>Math.log10(c),xs=rs.map(r=>lg(r.cost_per_1k_tasks_usd));
 const x0=Math.min(...xs)-.13,x1=Math.max(...xs)+.13;
 const px=c=>PL+((lg(c)-x0)/(x1-x0))*(W-PL-PR),py=q=>PT+(1-(q-83)/18)*(H-PT-PB);
 const grid=[85,90,95,100].map(q=>`<line x1="${PL}" y1="${py(q).toFixed(1)}" x2="${W-PR}" y2="${py(q).toFixed(1)}" stroke="currentColor" stroke-width="1" opacity=".18"/><text x="${PL-9}" y="${(py(q)+4).toFixed(1)}" text-anchor="end" font-size="10" fill="currentColor" opacity=".6">${q}%</text>`).join('');
 const xt=[0.01,0.1,1].filter(t=>lg(t)>=x0&&lg(t)<=x1);
 const xl=xt.map(t=>`<text x="${px(t).toFixed(1)}" y="${H-PB+20}" text-anchor="middle" font-size="10" fill="currentColor" opacity=".6">$${t}</text>`).join('');
 const dots=rs.map(r=>{const w=r.model===win.model;return `<circle cx="${px(r.cost_per_1k_tasks_usd).toFixed(1)}" cy="${py(r.judge_pct).toFixed(1)}" r="${w?7:4.5}" fill="${w?'var(--good)':'var(--accent)'}" opacity="${w?1:.6}"><title>${esc(r.model)} — ${r.judge_pct}%, $${r.cost_per_1k_tasks_usd}/1k</title></circle>`}).join('');
 return `
<h1>Which model should you actually use?</h1>
<p class="lede">Route tested every open model on Nebius Token Factory against the same
${sweep.fixtures} simple tasks, with the same judge, blind to which model answered. This is the
assessment that decides what your setup recommends &mdash; every figure traces to a logged call.</p>
<div class="panel">
 <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;color:var(--muted)" role="img"
  aria-label="Cost against accuracy for ${sweep.models_tested} models. Accuracy stays between ${Math.min(...rs.map(r=>r.judge_pct))} and ${Math.max(...rs.map(r=>r.judge_pct))} percent while price spans ${ratio} times.">
  ${grid}${xl}${dots}
  <text x="${PL}" y="${H-4}" font-size="10" fill="currentColor" opacity=".6">cost per 1,000 tasks (log scale) &#8594;</text>
 </svg>
 <p class="big" style="margin-top:14px">Accuracy barely moves. Price moves
 <strong class="good">${ratio}&times;</strong>. On simple work you are paying for headroom you
 never use.</p>
 <div class="src">source: results/sweep.json &middot; ${sweep.models_tested} models &middot; reproduce with <span class="num">route sweep</span></div>
</div>
<h2>Every model tested</h2>
<div class="panel">
 <table><tr><th>model</th><th>got it right</th><th>cost per 1,000 tasks</th><th>speed</th></tr>
 ${[...rs].sort((a,b)=>a.cost_per_1k_tasks_usd-b.cost_per_1k_tasks_usd).map(r=>`<tr class="${r.model===win.model?'win':''}">
  <td class="num" style="font-size:12.5px">${esc(r.model)}${r.model===win.model?' <span class="tag measured">pick</span>':''}</td>
  <td class="num ${r.judge_pct>=90?'good':'warn'}">${r.judge_pct}%</td>
  <td class="num">$${r.cost_per_1k_tasks_usd}</td>
  <td class="num dim">${r.latency_p50_ms} ms</td></tr>`).join('')}
 </table>
 <p class="note">${esc(sweep.max_tokens_note)}</p>
</div>`})():'';

// ---------------- Proof
V.proof=`
<h1>Proof, for the sceptical</h1>
<p class="lede">Every number on this site names the file it came from, and every figure is marked
either measured or computed. Nothing is rounded in our favour.</p>
${bench?`<h2>Head to head <span class="tag measured">measured</span></h2>
<div class="panel"><table><tr><th>model</th><th>exact match</th><th>judge pass</th><th>p50</th><th>cost</th></tr>
${Object.entries(bench.arms).map(([k,v])=>`<tr class="${k==='routed'?'win':''}"><td class="num" style="font-size:12.5px">${esc(v.model)}<div class="dim" style="font-size:11px">${k}</div></td>
<td class="num">${v.match_rate_pct}%</td><td class="num">${v.judge_pass_pct}%</td>
<td class="num dim">${v.latency_p50_ms} ms</td><td class="num ${k==='routed'?'good':''}">${usd(v.cost_usd,6)}</td></tr>`).join('')}</table>
<p class="note">n=${bench.fixture_count}, and every fixture embeds real content &mdash; source
files, stack traces, git history, raw usage records. An earlier set of toy questions had these two
models tied; on realistic work the cheaper one gives up ground. Both numbers are in the repo's
history. The cost gap is ${(bench.arms.strong.cost_usd/bench.arms.routed.cost_usd).toFixed(1)}&times;.</p><div class="src">source: results/bench.json</div></div>`:''}
${bench?(()=>{const r=bench.arms.routed;const pr={'claude-haiku-4-5':[1,5],'claude-sonnet-5':[2,10],'claude-opus-5':[5,25],'gpt-6-astra':[10,50]};
 return `<h2>The same work at big-model prices <span class="tag computed">computed</span></h2>
 <div class="panel"><table><tr><th>model</th><th>cost for the same 20 tasks</th><th>vs the cheap one</th></tr>
 ${Object.entries(pr).map(([m,[i,o]])=>{const c=(r.tokens_in*i+r.tokens_out*o)/1e6;return `<tr><td class="num">${m}</td><td class="num">${usd(c,6)}</td><td class="num">${(c/r.cost_usd).toFixed(0)}&times;</td></tr>`}).join('')}</table>
 <p class="note">Arithmetic, not an experiment: real token counts at published rates. No calls
 were made to these models, and it is labelled computed for that reason.</p></div>`})():''}
${replay?`<h2>Replayed over real history <span class="tag measured">measured</span></h2>
<div class="panel"><p class="big" style="font-size:16px">${replay.requests.toLocaleString()} real
requests over ${replay.window.days} days, re-priced from raw token counts: ${usd(replay.actual_cost_usd)}.</p>
<table><tr><th>share moved</th><th>bill becomes</th><th>saved</th></tr>
${replay.counterfactual_band.map(b=>`<tr><td class="num">${(b.mechanical_share*100).toFixed(0)}%</td><td class="num">${usd(b.cost_usd)}</td><td class="num good">${usd(b.saved_usd)} (${b.saved_pct}%)</td></tr>`).join('')}</table>
<p class="note">${esc(replay.band_note)}</p><div class="src">source: results/replay.json</div></div>`:''}
${harness?`<h2>The wider bill <span class="tag measured">measured</span></h2>
<div class="panel"><p class="big" style="font-size:16px">${usd(harness.total_cost_usd)} over
${harness.window.days} days across three AI tools.</p>
<table><tr><th>tool</th><th>spend</th></tr>${Object.entries(harness.by_tool).map(([t,c])=>`<tr><td>${esc(t)}</td><td class="num">${usd(c)}</td></tr>`).join('')}</table>
<div class="src">source: results/harness-usage.json</div></div>`:''}
${frontier?`<h2>Against Claude, measured <span class="tag measured">measured</span></h2>
<div class="panel"><table><tr><th>model</th><th>exact match</th><th>judge pass</th><th>p50</th><th>cost for 21 tasks</th></tr>
${Object.values(frontier.arms).filter(a=>a.ok>0).map(a=>`<tr><td class="num" style="font-size:12.5px">${esc(a.model)}</td><td class="num">${a.match_rate_pct}%</td><td class="num">${a.judge_pass_pct}%</td><td class="num dim">${a.latency_p50_ms} ms</td><td class="num">${usd(a.cost_usd,6)}</td></tr>`).join('')}
${frontier.open_weight_arm?`<tr class="win"><td class="num" style="font-size:12.5px">${esc(frontier.open_weight_arm.model)}<div class="dim" style="font-size:11px">open weight, Nebius</div></td><td class="num">${frontier.open_weight_arm.match_rate_pct}%</td><td class="num">${frontier.open_weight_arm.judge_pass_pct}%</td><td class="num dim">${frontier.open_weight_arm.latency_p50_ms} ms</td><td class="num good">${usd(frontier.open_weight_arm.cost_usd,6)}</td></tr>`:''}
</table><p class="note">Real calls to the Anthropic API, graded by the same blind judge as every
other arm. This replaces an arithmetic estimate that earlier versions of this page had to label
computed. Total spend on the run: ${usd(frontier.total_spend_usd,4)}.</p>
<div class="src">source: results/frontier.json</div></div>`:''}
${escalate?`<h2>Automatic upgrading &mdash; it did not work <span class="tag computed">negative result</span></h2>
<div class="panel"><p class="big" style="font-size:16px">Answer with the cheap model, detect a weak
answer, and pay for the strong one only then. It escalated
<strong>${escalate.escalation_rate_pct}%</strong> of tasks, cost
<strong>${(escalate.cost_usd/bench.arms.routed.cost_usd).toFixed(1)}&times;</strong> more than the
cheap model alone, and scored <strong>${escalate.judge_pass_pct}%</strong> &mdash; exactly what the
cheap model scored by itself.</p>
<p class="note">Two gate designs were tried. Asking the cheap model whether its own answer looked
complete escalated 1 task in 21 and changed nothing: a wrong answer from a small model is usually
well-formed and confident, so form does not reveal wrongness. Answering twice and escalating on
disagreement escalated more, but not the tasks that were actually wrong. The honest conclusion is
that a cheap, general-purpose confidence gate does not work here; a useful gate has to verify
against the task itself &mdash; run the test, validate the schema &mdash; which is per-job work.
It is on the record because it is the kind of feature a demo usually claims and never measures.</p>
<div class="src">source: results/escalate.json</div></div>`:''}
<h2>What is not built</h2>
<div class="panel"><p class="note" style="margin-top:0">Automatic escalation is measured and does not
