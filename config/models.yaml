  claude-fable-5-1: { provider: anthropic, input: 10, output: 50, cache_read: 0.25, source: claude-api skill, confidence: high }
  claude-fable-5: { provider: anthropic, input: 10, output: 50, source: claude-api skill, confidence: high }
  claude-opus-5: { provider: anthropic, input: 5, output: 25, fast: { input: 10, output: 50 }, source: claude-api skill, confidence: high }
  claude-opus-4-8: { provider: anthropic, input: 5, output: 25, fast: { input: 10, output: 50 }, source: claude-api skill, confidence: high }
  claude-opus-4-7: { provider: anthropic, input: 5, output: 25, source: claude-api skill, confidence: high }
  claude-opus-4-6: { provider: anthropic, input: 5, output: 25, source: claude-api skill, confidence: high }
  claude-sonnet-5: { provider: anthropic, input: 2, output: 10, source: claude-api skill, confidence: high }
  claude-sonnet-4-6: { provider: anthropic, input: 3, output: 15, source: claude-api skill, confidence: high }
  claude-haiku-4-5: { provider: anthropic, input: 1, output: 5, source: claude-api skill, confidence: high }

  # TypeSafe Jev classifier: $0.042 per 1M input tokens, output free. Used only for the decision-density and savings
