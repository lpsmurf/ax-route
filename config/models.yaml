# The share of total token cost to treat as routable in the phase-2 savings scenario. It approximates
# the mechanical share but is applied across all usage until real-work replay classifies rows. This is
# operator-set policy, not a measurement —
# unlike `share`, the model itself is never hard-coded here: `ax plans`/the dashboard always resolve it
# live from the newest bench evidence (ax/core/route/evidence.ts, evals/route/results/mechanical/), and
# show no routing/savings line at all when no bench result has cleared the bar yet. Run `ax route bench
# --job mechanical` to produce that evidence; `ax route evidence` prints today's resolved model.
routing:
  mechanical:
    share: 0.5

  # Routing policy per agent role (spec 003 T032; parsed by ax/core/route/policy.ts). The declared tier stays
  # in each agent's frontmatter `model:` (Gate VI); this says which job a role belongs to and which models it
  # may be routed to. Policy never names the winner: the routed model is resolved live from bench evidence
  # (ax route evidence), and a role stays "untested" until a job has a result. A role not listed here has no
  # routing policy. `preferred` (optional, must be in `allowed`) wins over a cheaper model when the evidence
  # marks it deployable.
  # `thresholds` can only tighten the absolute floors in ax/core/route/bench.ts (bar 0.9, 20 samples).
  thresholds: { bar: 0.9, min_samples: 20 }
  roles:
    qa-test: { job: mechanical, allowed: [google/gemma-3-27b-it, openai/gpt-oss-120b, Qwen/Qwen3-235B-A22B-Instruct-2507] }
    memory-retrieval: { job: mechanical, allowed: [google/gemma-3-27b-it, openai/gpt-oss-120b, Qwen/Qwen3-235B-A22B-Instruct-2507] }
    learning-extractor: { job: mechanical, allowed: [google/gemma-3-27b-it, openai/gpt-oss-120b, Qwen/Qwen3-235B-A22B-Instruct-2507] }
