# API list prices, USD per 1M tokens. Used by `ax usage` to show what the same work would cost
# at pay-as-you-go API rates (compare with config/rates.yaml subscriptions).
# Lookup: exact model id, else the longest key that is a prefix (so dated ids like
# claude-haiku-4-5-20251001 match claude-haiku-4-5). A model not listed here gets cost null.
# `cache_write_5m` / `cache_write_1h` / `cache_read` are multiples of `input` unless given in $.
# Every entry names its source; re-check prices when a new model shows up in `ax usage --unpriced`.

defaults:
  anthropic: { cache_write_5m: 1.25x, cache_write_1h: 2x, cache_read: 0.1x }
  openai: { cache_write_5m: 1.25x, cache_read: 0.1x }

pricing:
